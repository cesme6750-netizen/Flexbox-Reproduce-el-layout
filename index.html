<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios de CSS Grid</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <h2>Ejercicio 1: 3 Columnas</h2>
    <div class="grid-ejercicio-1">
        <div class="caja"></div>
        <div class="caja"></div>
        <div class="caja"></div>
    </div>

    <hr>

    <h2>Ejercicio 2: 2 Columnas, 6 Cajas</h2>
    <div class="grid-ejercicio-2">
        <div class="caja"></div>
        <div class="caja"></div>
        <div class="caja"></div>
        <div class="caja"></div>
        <div class="caja"></div>
        <div class="caja"></div>
    </div>

    <hr>

    <h2>Ejercicio 3: Galería </h2>
    <div class="grid-ejercicio-3">
        <div class="caja imagen"> <img src="s1.jfif" alt="Imagen 1"> </div>
        <div class="caja imagen"> <img src="s2.jfif" alt="Imagen 2"> </div>
        <div class="caja imagen"> <img src="s3.jfif" alt="Imagen 3"> </div>
        <div class="caja imagen"> <img src="s4.jfif" alt="Imagen 4"> </div>
    </div>

    <hr>

    <h2>Ejercicio 4: Dashboard sencillo</h2>
    <div class="grid-ejercicio-4">
        <div class="caja"></div>
        <div class="caja"></div>
        <div class="caja"></div>
        <div class="caja"></div>
        <div class="caja"></div>
        <div class="caja"></div>
    </div>

</body>
</html>
